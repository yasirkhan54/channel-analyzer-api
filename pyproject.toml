[project]
name = "channel-analyzer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "prisma>=0.15.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["prisma/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
