services:
  # Creates the youtube_channel_analyzer database on the shared "postgres"
  # container (started by jarvis-os-infra) when it does not exist yet, then exits.
  postgres-setup:
    image: postgres:17-alpine
    container_name: channel-analyzer-postgres-setup
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_channel_analyzer}
    command:
      - sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        psql -h postgres -U postgres -tAc "select 1 from pg_database where datname = '$$POSTGRES_DB'" | grep -q 1 \
          || createdb -h postgres -U postgres "$$POSTGRES_DB"
    secrets:
      - postgres_password
    networks:
      - postgres-network

  api:
    build: .
    container_name: channel-analyzer-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_channel_analyzer}
    # Local development: code is mounted and uvicorn reloads on change.
    # DATABASE_URL is built from the shared Postgres password file.
    command: sh -c 'export DATABASE_URL="postgresql://postgres:$$(cat /run/secrets/postgres_password)@postgres:5432/$$POSTGRES_DB" && prisma migrate deploy && uvicorn application:app --host 0.0.0.0 --port 8010 --reload'
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8010}:8010"
    secrets:
      - postgres_password
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    networks:
      - postgres-network

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-${HOME}/.config/postgres/password}

networks:
  # Network of the shared "postgres" container from jarvis-os-infra.
  postgres-network:
    name: jarvis-os_default
    external: true
